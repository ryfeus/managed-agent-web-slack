[project]
name = "managed-agents-app"
version = "0.2.0"
description = "Python backend for the Claude Managed Agents web and Slack application"
requires-python = ">=3.14"
dependencies = [
  "anthropic[webhooks]>=1.3.0",
  "aurora-dsql-python-connector>=0.2.7",
  "boto3>=1.40.0",
  "fastapi>=0.118.0",
  "httpx>=0.28.0",
  "psycopg[binary]>=3.2.10",
  "psycopg-pool>=3.2.6",
  "pydantic>=2.11.0",
  "python-dotenv>=1.1.0",
  "slack-sdk>=3.43.0",
  "uvicorn>=0.37.0",
]

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
  "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/managed_agents_app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires live AWS DSQL and/or Anthropic credentials"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["managed_agents_app"]
exclude = ["tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aurora_dsql_psycopg.*", "slack_sdk.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
