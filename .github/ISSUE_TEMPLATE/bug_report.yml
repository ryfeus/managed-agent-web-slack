name: Bug report
description: Report a reproducible problem without confidential deployment data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, tokens, account IDs, private endpoints, or security vulnerabilities. Use Private Vulnerability Reporting for security issues.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide safe, minimal reproduction steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove message content and all sensitive deployment information.
