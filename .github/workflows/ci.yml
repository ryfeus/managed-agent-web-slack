name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_PYTHON: "3.14"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt && rustup default 1.99.0
      - run: npm ci
      - run: uv sync --directory backend --locked
      - run: npm run check

  lambda-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:python && npm run build:functions

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.3"
      - name: Create Lambda artifact placeholders for Terraform tests
        run: |
          mkdir -p dist/lambdas
          touch dist/lambdas/python-buffered.zip \
            dist/lambdas/a2a-event-sink.zip \
            dist/lambdas/web-function.zip \
            dist/lambdas/cma-preview.zip \
            dist/lambdas/slack-preview.zip \
            dist/lambdas/cma-controller.zip
      - run: ./scripts/check_terraform.sh

  semantic-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt && rustup default 1.99.0
      - run: npm ci
      - run: uv sync --directory backend --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: local-e2e-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-web-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt && rustup default 1.99.0
      - run: npm ci
      - run: uv sync --directory backend --locked
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:production
        env:
          PYTHONDONTWRITEBYTECODE: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: production-web-e2e-failure
          path: |
            playwright-report-production/
            test-results/
          retention-days: 7

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Gitleaks 8.24.3
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_checksums.txt
          grep ' gitleaks_8.24.3_linux_x64.tar.gz$' gitleaks_8.24.3_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.24.3_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks_8.24.3_linux_x64.tar.gz gitleaks_8.24.3_checksums.txt
      - run: python3 scripts/scan_secrets.py
