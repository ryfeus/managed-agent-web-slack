[package]
name = "openappa-cma"
version = "0.1.0"
edition = "2024"

[dependencies]
# scripts/prepare_openappa.py verifies the exact revision and applies one API visibility patch.
appa = { path = "upstream/appa-runtime", default-features = false }
appa-eventlog = { path = "upstream/appa-eventlog" }
appa-runtime-api = { path = "upstream/appa-runtime-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
toml = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
