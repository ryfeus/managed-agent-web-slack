[package]
name = "openappa-cma"
version = "0.1.0"
edition = "2024"

[dependencies]
appa = { git = "https://github.com/archestra-ai/OpenAPPA", rev = "c7c1e1ef36aa07604b421c48be266d7397557656", default-features = false }
appa-eventlog = { git = "https://github.com/archestra-ai/OpenAPPA", rev = "c7c1e1ef36aa07604b421c48be266d7397557656" }
appa-runtime-api = { git = "https://github.com/archestra-ai/OpenAPPA", rev = "c7c1e1ef36aa07604b421c48be266d7397557656" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
toml = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
